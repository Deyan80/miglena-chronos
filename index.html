<style>

<script>
const $=s=>document.querySelector(s), SEC=15000;
const P=[
 ['01',['Морето, тишината и изкуството да живееш','Живот, подреден около онова, което наистина има значение.'],['The sea, the silence and the art of living','A life arranged around what truly matters.']],
 ['03',['Красота, съчетана с усмивка','Естествена красота, забелязана навсякъде.'],['Beauty, combined with a smile','Natural beauty, noticed everywhere.']],
 ['04',['От модна писта до удоволствие за душата','Вече не е професия, а удоволствие.'],['From the runway to a pleasure for the soul','No longer a profession — a pleasure.']],
 ['06',['Стил, който вдъхновява','Вкус, приятелство и красота — без напрежението на индустрията.'],['Style that inspires','Taste, friendship and beauty — without the pressure of the industry.']],
 ['02',['Грация във всяко движение','Усет за линия, движение и увереност.'],['Grace in every movement','A sense of line, movement and confidence.']],
 ['08',['Всеки миг — нова глава','Пътуванията и красивите мигове са другата ѝ голяма страст.'],['Every moment — a new chapter','Travel and beautiful moments are her other great passion.']],
 ['05',['Красотата ѝ разказва своя история','Изяществото ѝ никога не остава незабелязано.'],['Her beauty tells its own story','Her elegance never goes unnoticed.']],
 ['07',['Излъчване, което остава в паметта','Пилатес, реформер тренировки и дълги разходки покрай брега.'],['A presence that stays in memory','Pilates, reformer workouts and long walks along the shore.']],
 ['09',['Красива във всеки миг','„Не бързам за никъде — просто съм тук, с морето и с хубавите неща.“'],['Beautiful in every moment','“I\'m not rushing anywhere — I\'m simply here, with the sea and the good things.”']],
 ['10',['Светлина в погледа ѝ','Грижа за равновесието — физическо и душевно.'],['Light in her gaze','Caring for her balance — of body and soul.']],
 ['11',['Изтънчен вкус и очарование','Живея, мечтая, обичам и се наслаждавам на живота.'],['Refined taste and charm','I live, I dream, I love — and I enjoy life.']]

const Z=[['Europe/Sofia','София','Sofia'],['Asia/Nicosia','Никозия','Nicosia'],['Europe/London','Лондон','London'],['Europe/Paris','Париж','Paris'],['Europe/Moscow','Москва','Moscow'],['Africa/Cairo','Кайро','Cairo'],['Asia/Dubai','Дубай','Dubai'],['Asia/Kolkata','Колката','Kolkata'],['Asia/Tokyo','Токио','Tokyo'],['Australia/Sydney','Сидни','Sydney'],['Pacific/Auckland','Окланд','Auckland'],['America/New_York','Ню Йорк','New York'],['America/Chicago','Чикаго','Chicago'],['America/Los_Angeles','Лос Анджелис','Los Angeles'],['America/Sao_Paulo','Сао Пауло','São Paulo']];
const T={bg:{brand:'ХРОНОС',sub:'ВРЕМЕ · МОРЕ · ГРАЦИЯ',hint:'Натисни ♪ за музика',more:'Друга зона',copied:'Линкът е копиран',title:'Миглена Иванова — Хронос',txt:'Морето, тишината и изкуството да живееш',copy:'Копирай линка',lbl:'EN'},
 en:{brand:'CHRONOS',sub:'TIME · SEA · GRACE',hint:'Tap ♪ for music',more:'Other zone',copied:'Link copied',title:'Miglena Ivanova — Chronos',txt:'The sea, the silence and the art of living',copy:'Copy link',lbl:'BG'}};
const st=(k,d)=>{try{return localStorage.getItem(k)||d}catch(e){return d}}, sv=(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}};
let lang=st('mc-lang','bg'), zone=st('mc-zone','Europe/Sofia'), theme=st('mc-theme','dark');
const L=()=>T[lang], li=lang=>lang==='bg'?0:1;

/* ---------- clock build ---------- */
const dial=$('#dial');
for(let i=0;i<60;i++){const t=document.createElement('i');t.className='tk'+(i%5?'':' h');t.style.setProperty('--a',i*6+'deg');dial.appendChild(t)}
for(let i=1;i<=12;i++){const n=document.createElement('i');n.className='nm';n.style.setProperty('--a',i*30+'deg');n.textContent=i;dial.appendChild(n)}
function gear(el,teeth,r1,r2,spokes){let d='';for(let i=0;i<teeth*4;i++){const a=i/(teeth*4)*Math.PI*2,r=(i%4<2)?r2:r1;d+=(i?'L':'M')+(Math.cos(a)*r).toFixed(2)+' '+(Math.sin(a)*r).toFixed(2)}
 d+='Z';let s='<path d="'+d+'"/><circle r="'+(r1*.62)+'"/><circle r="4"/>';for(let i=0;i<spokes;i++){const a=i/spokes*Math.PI*2;s+='<path d="M0 0L'+Math.cos(a)*r1*.62+' '+Math.sin(a)*r1*.62+'"/>'}el.innerHTML=s}
gear($('#g1'),28,46,49,6);gear($('#g2'),16,46,49,5);
const F={};
function parts(z,d){const f=F[z]||(F[z]=new Intl.DateTimeFormat('en-GB',{timeZone:z,hourCycle:'h23',hour:'numeric',minute:'numeric',second:'numeric',day:'numeric'}));const o={};f.formatToParts(d).forEach(p=>o[p.type]=+p.value);return o}
const zn=z=>Z.find(x=>x[0]===z)||Z[0];
const chips=$('#zones');
function buildZones(){chips.innerHTML='';[Z[0],Z[1]].forEach(z=>{const c=document.createElement('button');c.className='chip';c.dataset.z=z[0];c.innerHTML='<span>'+z[1+li(lang)]+'</span><b>--:--:--</b>';c.onclick=()=>setZone(z[0]);chips.appendChild(c)});
 const s=document.createElement('select');s.className='chip';s.setAttribute('aria-label',L().more);s.innerHTML='<option value="">'+L().more+'</option>'+Z.slice(2).map(z=>'<option value="'+z[0]+'">'+z[1+li(lang)]+'</option>').join('');s.onchange=()=>s.value&&setZone(s.value);s.id='sel';chips.appendChild(s);markZone()}
function markZone(){chips.querySelectorAll('.chip[data-z]').forEach(c=>c.classList.toggle('sel',c.dataset.z===zone));const s=$('#sel');if(s)s.classList.toggle('sel',!!Z.slice(2).find(z=>z[0]===zone));if(s)s.value=Z.slice(2).find(z=>z[0]===zone)?zone:''}
function setZone(z){zone=z;sv('mc-zone',z);markZone();tickSnd()}
let lastS=-1,pad2=n=>String(n).padStart(2,'0');
function frame(){const d=new Date(),ms=d.getMilliseconds(),p=parts(zone,d),s=p.second+ms/1000,m=p.minute+s/60,h=(p.hour%12)+m/60;
 $('#hs').style.transform='translateZ(30px) rotate('+s*6+'deg)';$('#hm').style.transform='translateZ(22px) rotate('+m*6+'deg)';$('#hh').style.transform='translateZ(14px) rotate('+h*30+'deg)';
 if(p.second!==lastS){lastS=p.second;$('#win').textContent=p.day;chips.querySelectorAll('.chip[data-z]').forEach(c=>{const q=parts(c.dataset.z,d);c.querySelector('b').textContent=pad2(q.hour)+':'+pad2(q.minute)+':'+pad2(q.second)});tickSnd()}
 requestAnimationFrame(frame)}

/* ---------- language / theme / texts ---------- */
function applyLang(){document.documentElement.lang=lang;const t=L();$('#brand').innerHTML=t.brand+'<small>'+t.sub+'</small>';$('#bLng').textContent=t.lbl;document.title=t.title;
 $('#name').textContent=lang==='bg'?'Миглена Иванова':'Miglena Ivanova';$('#hint').textContent=t.hint;buildZones();buildShare();
 document.querySelectorAll('.shot').forEach(e=>fill(e))}
function applyTheme(){document.documentElement.dataset.theme=theme;document.querySelector('meta[name=theme-color]')||document.head.insertAdjacentHTML('beforeend','<meta name="theme-color" content="">');document.querySelector('meta[name=theme-color]').content=theme==='dark'?'#070812':'#f7efe8'}
$('#bLng').onclick=()=>{lang=lang==='bg'?'en':'bg';sv('mc-lang',lang);applyLang()};
$('#bThm').onclick=()=>{theme=theme==='dark'?'light':'dark';sv('mc-theme',theme);applyTheme()};

/* ---------- photos flying out of the depth ---------- */
let idx=0;const world=$('#world'),RM=matchMedia('(prefers-reduced-motion:reduce)').matches;
function fill(e){const d=P[e.dataset.i][1+li(lang)];e.querySelector('h2').textContent=d[0];e.querySelector('p').textContent=d[1];e.querySelector('img').alt=T[lang].title}
function launch(){if(document.hidden)return;const i=idx++%P.length,dir=(idx%2)?1:-1,e=document.createElement('figure');e.className='shot'+(dir>0?' rev':'');e.dataset.i=i;
 e.innerHTML='<img src="miglena-'+P[i][0]+'.jpg" alt=""><figcaption><h2></h2><p></p></figcaption>';fill(e);world.appendChild(e);
 const wide=innerWidth>720,x=wide?dir*innerWidth*.09:0,y=(Math.random()-.5)*innerHeight*.07,rz=(Math.random()-.5)*7,ry=-dir*16,zEnd=RM?200:930;
 const tf=(x,z,ry,rz)=>'translate(-50%,-50%) translate3d('+x+'px,'+y+'px,'+z+'px) rotateY('+ry+'deg) rotateZ('+rz+'deg)';
 e.animate([{transform:tf(x,-4600,ry,rz),opacity:0},{opacity:1,offset:.13},{opacity:1,offset:.72},{transform:tf(x*1.25,zEnd,ry/3,rz/2),opacity:0}],{duration:SEC+1800,easing:'cubic-bezier(.32,.12,.62,.82)',fill:'forwards'}).onfinish=()=>e.remove();
 whoosh();const b=$('#prog');b.style.animation='none';b.offsetWidth;b.style.animation=''}

/* ---------- pointer parallax ---------- */
let tx=0,ty=0,cx=0,cy=0;
addEventListener('pointermove',e=>{tx=(e.clientX/innerWidth-.5)*2;ty=(e.clientY/innerHeight-.5)*2});
(function tilt(){cx+=(tx-cx)*.06;cy+=(ty-cy)*.06;world.style.setProperty('--ry',(cx*7).toFixed(2)+'deg');world.style.setProperty('--rx',(-cy*5).toFixed(2)+'deg');requestAnimationFrame(tilt)})();

/* ---------- colour space: aurora + starfield flying toward you ---------- */
const cv=$('#bg'),g=cv.getContext('2d');let W,H,DPR=Math.min(devicePixelRatio||1,1.5);
function rs(){W=cv.width=innerWidth*DPR;H=cv.height=innerHeight*DPR}addEventListener('resize',rs);rs();
const stars=Array.from({length:170},()=>({x:Math.random()*2-1,y:Math.random()*2-1,z:Math.random()}));
function paint(t){t/=1000;const dark=theme==='dark';g.globalCompositeOperation='source-over';g.fillStyle=dark?'#070812':'#f7efe8';g.fillRect(0,0,W,H);
 g.globalCompositeOperation=dark?'lighter':'multiply';
 for(let k=0;k<5;k++){const hue=(t*9+k*68+200)%360,x=W*(.5+.38*Math.sin(t*.13+k*1.7)),y=H*(.5+.34*Math.cos(t*.11+k*2.3)),r=Math.max(W,H)*(.38+.08*Math.sin(t*.2+k));
  const gr=g.createRadialGradient(x,y,0,x,y,r);gr.addColorStop(0,dark?'hsla('+hue+',85%,52%,.34)':'hsla('+hue+',90%,78%,.55)');gr.addColorStop(1,'hsla('+hue+',80%,50%,0)');g.fillStyle=gr;g.fillRect(0,0,W,H)}
 g.globalCompositeOperation='source-over';const sp=RM?.0004:.0022;
 for(const s of stars){s.z-=sp;if(s.z<=.02){s.x=Math.random()*2-1;s.y=Math.random()*2-1;s.z=1}
  const k=.35/s.z,px=W/2+s.x*k*W*.5,py=H/2+s.y*k*H*.5,a=Math.min(1,(1-s.z)*1.6),r=(1-s.z)*2.4*DPR;
  g.fillStyle=dark?'rgba(255,240,215,'+a*.85+')':'rgba(120,70,60,'+a*.5+')';g.beginPath();g.arc(px,py,r,0,6.283);g.fill()}
 requestAnimationFrame(paint)}

/* ---------- audio: pad + bells + whoosh + tick (Web Audio, no files) ---------- */
let AC,M,DL,snd=false,padT,bellT;
const CH=[[220,261.6,329.6,392],[174.6,220,261.6,329.6],[261.6,329.6,392,493.9],[196,246.9,293.7,392]],PE=[440,523.3,587.3,659.3,784,880,1046.5];
function aInit(){AC=new(window.AudioContext||window.webkitAudioContext)();M=AC.createGain();M.gain.value=0;const lp=AC.createBiquadFilter();lp.type='lowpass';lp.frequency.value=2400;M.connect(lp);lp.connect(AC.destination);
 DL=AC.createDelay(2);DL.delayTime.value=.46;const fb=AC.createGain();fb.gain.value=.5;DL.connect(fb);fb.connect(DL);DL.connect(M)}
let ci=0;
function pad(){const t=AC.currentTime;CH[ci++%4].forEach((f,i)=>{[-6,6].forEach(dt=>{const o=AC.createOscillator(),v=AC.createGain();o.type=i%2?'triangle':'sine';o.frequency.value=f/(i<2?2:1);o.detune.value=dt;v.gain.setValueAtTime(0,t);v.gain.linearRampToValueAtTime(.07,t+2.4);v.gain.linearRampToValueAtTime(0,t+8.6);o.connect(v);v.connect(M);o.start(t);o.stop(t+9)})})}
function bell(){const t=AC.currentTime,f=PE[Math.random()*PE.length|0];[[1,.12],[2.76,.04]].forEach(([m,a])=>{const o=AC.createOscillator(),v=AC.createGain();o.frequency.value=f*m;v.gain.setValueAtTime(a,t);v.gain.exponentialRampToValueAtTime(.0001,t+3.2);o.connect(v);v.connect(M);v.connect(DL);o.start(t);o.stop(t+3.3)});bellT=setTimeout(bell,1100+Math.random()*1700)}
function whoosh(){if(!snd)return;const t=AC.currentTime,n=AC.createBufferSource(),b=AC.createBuffer(1,AC.sampleRate*3,AC.sampleRate),d=b.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;n.buffer=b;
 const f=AC.createBiquadFilter(),v=AC.createGain();f.type='bandpass';f.Q.value=2.5;f.frequency.setValueAtTime(180,t);f.frequency.exponentialRampToValueAtTime(2600,t+2.8);v.gain.setValueAtTime(0,t);v.gain.linearRampToValueAtTime(.16,t+1.6);v.gain.linearRampToValueAtTime(0,t+3);n.connect(f);f.connect(v);v.connect(M);v.connect(DL);n.start(t)}
function tickSnd(){if(!snd||lastS<0)return;const t=AC.currentTime,o=AC.createOscillator(),v=AC.createGain();o.type='square';o.frequency.value=lastS%2?2600:3100;v.gain.setValueAtTime(.012,t);v.gain.exponentialRampToValueAtTime(.0001,t+.03);o.connect(v);v.connect(M);o.start(t);o.stop(t+.04)}
$('#bSnd').onclick=function(){$('#hint').style.opacity=0;if(!AC)aInit();snd=!snd;this.classList.toggle('on',snd);
 if(snd){AC.resume();M.gain.cancelScheduledValues(AC.currentTime);M.gain.linearRampToValueAtTime(.55,AC.currentTime+2);pad();padT=setInterval(pad,7500);bell();whoosh()}
 else{M.gain.cancelScheduledValues(AC.currentTime);M.gain.linearRampToValueAtTime(0,AC.currentTime+1);clearInterval(padT);clearTimeout(bellT)}};

/* ---------- share ---------- */
const url=()=>location.href.split('#')[0];
function toast(m){const t=$('#toast');t.textContent=m;t.style.opacity=1;setTimeout(()=>t.style.opacity=0,1800)}
function buildShare(){const t=L(),u=encodeURIComponent(url()),x=encodeURIComponent(t.txt),i=encodeURIComponent(new URL('miglena-03.jpg',url()).href);
 const N=[['Facebook','f','https://www.facebook.com/sharer/sharer.php?u='+u],['X','𝕏','https://twitter.com/intent/tweet?text='+x+'&url='+u],['WhatsApp','WA','https://wa.me/?text='+x+'%20'+u],['Telegram','TG','https://t.me/share/url?url='+u+'&text='+x],['LinkedIn','in','https://www.linkedin.com/sharing/share-offsite/?url='+u],['Viber','Vb','viber://forward?text='+x+'%20'+u],['Pinterest','P','https://pinterest.com/pin/create/button/?url='+u+'&media='+i+'&description='+x]];
 const s=$('#share');s.innerHTML='';N.forEach(n=>{const a=document.createElement('a');a.className='b';a.href=n[2];a.target='_blank';a.rel='noopener';a.title=n[0];a.setAttribute('aria-label',n[0]);a.textContent=n[1];a.style.textDecoration='none';s.appendChild(a)});
 const c=document.createElement('button');c.className='b';c.textContent='🔗 '+t.copy;c.onclick=async()=>{try{await navigator.clipboard.writeText(url())}catch(e){prompt(t.copy,url())}toast(t.copied)};s.appendChild(c)}
$('#bShr').onclick=()=>$('#share').classList.toggle('open');
addEventListener('keydown',e=>e.key==='Escape'&&$('#share').classList.remove('open'));

applyTheme();applyLang();requestAnimationFrame(frame);requestAnimationFrame(paint);
launch();setInterval(launch,SEC);
setTimeout(()=>{if(!snd)$('#hint').style.opacity=0},12000);
